spring:
  application:
    name: article-publish-platform

  datasource:
    url: jdbc:mysql://localhost:3306/article_publish_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC
    username: article_user
    password: article_password_123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
app:
  jwtSecret: your-secret-key-change-this-in-production-min-32-chars
  jwtExpirationInMs: 86400000

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.articlehub: DEBUG

# AI 发布设置配置（默认使用通义千问，也支持 OpenAI 兼容接口）
ai:
  api-key: ""   # 在此填入你的 API Key（通义千问：https://dashscope.console.aliyun.com）
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus